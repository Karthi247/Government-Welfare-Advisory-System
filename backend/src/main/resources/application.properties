# Spring Boot application properties
# ===============================
# Application Info
# ===============================
spring.application.name=Government-Welfare-Advisory-System
server.port=8080

# ===============================
# Database Configuration (MySQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/welfare_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Logging Configuration
# ===============================
# logging.level.org.springframework=INFO
# logging.level.com.example.welfare=DEBUG

# ===============================
# JSON Configuration
# ===============================
# spring.jackson.serialization.indent_output=true

# ===============================
# ML API Configuration
# ===============================
ml.api.url=${ML_API_URL:http://localhost:5000/predict}
