name: CI/CD Pipeline

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build backend
        run: mvn -f backend/pom.xml clean package -DskipTests

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend Docker image
        run: docker build -t welfare-backend -f deployment/docker/Dockerfile_backend .

      - name: Build frontend Docker image
        run: docker build -t welfare-frontend -f deployment/docker/Dockerfile_frontend .

      - name: Build ML Docker image
        run: docker build -t welfare-ml -f deployment/docker/Dockerfile_ml .

  deploy-railway:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
      RAILWAY_SERVICE_BACKEND: ${{ secrets.RAILWAY_SERVICE_BACKEND }}
      RAILWAY_SERVICE_FRONTEND: ${{ secrets.RAILWAY_SERVICE_FRONTEND }}
      RAILWAY_SERVICE_ML: ${{ secrets.RAILWAY_SERVICE_ML }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway secrets
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT"
          test -n "$RAILWAY_SERVICE_BACKEND"
          test -n "$RAILWAY_SERVICE_FRONTEND"
          test -n "$RAILWAY_SERVICE_ML"

      - name: Deploy backend service
        run: railway up --service "$RAILWAY_SERVICE_BACKEND" --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID" --ci

      - name: Deploy frontend service
        run: railway up --service "$RAILWAY_SERVICE_FRONTEND" --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID" --ci

      - name: Deploy ML service
        run: railway up --service "$RAILWAY_SERVICE_ML" --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID" --ci
